[project]
name = "us-census"
version = "0.1.0"
description = "MCP Server for Analyzing US Census Data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.3",
    "elasticsearch>=8.0.0,<9.0.0",
    "mcp[cli]>=1.26.0",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    # --- GeoPandas + spatial stack --- 
    "geopandas>=1.0.0", 
    "shapely>=2.0.0", 
    "pyproj>=3.6.0", 
    "fiona>=1.9.0", 
    "rtree>=1.2.0",
]
